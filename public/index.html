<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comunicazioni</title>
<style>
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         margin: 0; background: #f3f4f6; color: #111; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 20px; }
  .item { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
          box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .item h3 { margin: 0 0 6px; font-size: 16px; }
  .item p { margin: 0; font-size: 14px; color: #374151; white-space: pre-wrap; }
  .item time { display: block; font-size: 12px; color: #9ca3af; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Comunicazioni</h1>
  <div id="list">Caricamento...</div>
</div>
<script>
  async function load() {
    const box = document.getElementById('list');
    try {
      const r = await fetch('/api/communications');
      const items = await r.json();
      if (!items.length) { box.textContent = 'Nessuna comunicazione al momento.'; return; }
      box.innerHTML = '';
      for (const it of items) {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = '<h3></h3><p></p><time></time>';
        div.querySelector('h3').textContent = it.title || '';
        div.querySelector('p').textContent = it.body || '';
        div.querySelector('time').textContent = new Date(it.createdAt).toLocaleString('it-IT');
        box.appendChild(div);
      }
    } catch {
      box.textContent = 'Impossibile caricare le comunicazioni.';
    }
  }
  load();
  setInterval(load, 30000); // ricarica ogni 30s
</script>
</body>
</html>
